name: CI

# Controlled-scale readiness SP-003: the project had zero automated gating
# on push/PR (the only existing workflow, whatsapp-container-build.yml, is
# manual-trigger only, per its own header comment). This runs the checks
# every commit should have passed locally anyway, so a defect can't reach
# main/deploy silently because a developer forgot a step.
#
# Most of the 15 `src/features/**/*.integration.test.ts` suites still
# require real QA staff credentials this environment has no path to
# create (CUSTOMER_360_TEST_EMAIL/PASSWORD, STAFF_360_*_EMAIL/PASSWORD,
# QA_AUDIT_CLUB_ID, etc. -- different suites need different fixtures, see
# docs/TEST_PLAN.md) and skip cleanly without them (see each file's own
# header). Wiring real secrets into a public/shared CI runner is a
# separate, deliberate decision the repo owner should make explicitly.
#
# PORTAL SECURITY CI HARDENING (2026-09-06): the "Unit tests" step below
# now actually WIRES CUSTOMER_360_TEST_EMAIL/PASSWORD through to the test
# process (previously commented out) -- so the moment those two secrets
# are added as GitHub repository secrets, every gated suite that only
# needs them (including the two portal cross-persona-authorization /
# security suites below) starts executing for real on the very next run,
# with zero further code changes. STAFF_360_*/QA_AUDIT_CLUB_ID are also
# wired for the OTHER suites that declare a need for them (see each
# suite's own header comment) -- but are NOT required by the two portal
# suites this hardening pass is scoped to.
#
# The "Portal security suites must not silently SKIP -> GREEN" step
# further down is a separate, narrowly-scoped hard-fail gate: it does NOT
# fail CI today (there is no repository variable turning it on yet, and
# none of this PR's changes create one), but makes it a ONE-STEP action
# for the repo owner to make CI fail loudly, specifically for
# portal-cross-persona-authorization.integration.test.ts and
# claim-customer-corroboration.integration.test.ts, if those two ever
# silently skip again after being expected to run. See that step for the
# exact activation switch and rationale.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Secret scan (fail on likely committed credentials)
        run: |
          # Cheap, dependency-free scan for the shapes this project's own
          # rules explicitly forbid committing (service_role JWTs, raw
          # Supabase URLs with an embedded key, .env.local content). Not a
          # replacement for a real secret-scanning service -- a fast,
          # zero-setup first line of defense that fails loud on the most
          # common accidental-commit patterns.
          if git grep -nE "SUPABASE_SERVICE_ROLE_KEY\s*=\s*['\"]?ey" -- . ':!*.md' ':!.github/workflows/*'; then
            echo "::error::possible service_role key committed"
            exit 1
          fi
          if git grep -nE "sk_live_|sk_test_[A-Za-z0-9]{16,}" -- . ':!*.md' ':!.github/workflows/*'; then
            echo "::error::possible live/test secret key committed"
            exit 1
          fi
          if [ -f .env.local ] || [ -f .env ]; then
            echo "::error::.env or .env.local is committed -- these must never be tracked (see .env.example)"
            exit 1
          fi

      - name: Unit tests (integration suites skip without QA secrets -- see workflow header)
        run: npm test
        env:
          # Unit suites import the shared client but never contact Supabase.
          # Provide inert public-shaped values so module initialization succeeds;
          # authenticated integration suites still skip without their QA secrets.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          # Wired through (previously commented out) so that whichever of
          # these GitHub repository secrets the repo owner has actually
          # added start reaching the test process immediately -- vitest
          # exposes process.env directly on import.meta.env for
          # non-VITE_-prefixed names (verified empirically this pass), so
          # no further vitest.config.ts change is needed. Any secret left
          # unset simply resolves to an empty string here, which is
          # exactly what each suite's own `describeIfConfigured` gate
          # already treats as "not configured -- skip cleanly".
          CUSTOMER_360_TEST_EMAIL: ${{ secrets.CUSTOMER_360_TEST_EMAIL }}
          CUSTOMER_360_TEST_PASSWORD: ${{ secrets.CUSTOMER_360_TEST_PASSWORD }}
          STAFF_360_OWNER_EMAIL: ${{ secrets.STAFF_360_OWNER_EMAIL }}
          STAFF_360_OWNER_PASSWORD: ${{ secrets.STAFF_360_OWNER_PASSWORD }}
          STAFF_360_EMPLOYEE_EMAIL: ${{ secrets.STAFF_360_EMPLOYEE_EMAIL }}
          STAFF_360_EMPLOYEE_PASSWORD: ${{ secrets.STAFF_360_EMPLOYEE_PASSWORD }}
          QA_AUDIT_CLUB_ID: ${{ secrets.QA_AUDIT_CLUB_ID }}

      - name: Portal security suites must not silently SKIP -> GREEN
        # Hard-fail gate scoped to EXACTLY the two portal-security
        # integration suites this hardening pass covers --
        # portal-cross-persona-authorization.integration.test.ts and
        # claim-customer-corroboration.integration.test.ts. Both suites'
        # own header comments confirm they need only
        # CUSTOMER_360_TEST_EMAIL/CUSTOMER_360_TEST_PASSWORD (neither
        # references STAFF_360_* or any other var) -- so this check
        # asserts only that pair, not the other 13 integration suites'
        # unrelated fixtures (those legitimately have no QA credentials
        # in this environment yet and must keep skipping without turning
        # CI red -- see docs/TEST_PLAN.md).
        #
        # Defaults to NOT required (`false`) because the secrets
        # genuinely don't exist yet (`gh secret list` shows only
        # CLOUDFLARE_API_TOKEN) -- so this PR does not itself turn CI red
        # for a secret nobody has added. The moment the repo owner adds
        # CUSTOMER_360_TEST_EMAIL/PASSWORD as repository secrets AND sets
        # the `PORTAL_SECURITY_TESTS_REQUIRED` repository/workflow
        # variable to `true` (Settings -> Secrets and variables ->
        # Actions -> Variables), this step starts failing loudly instead
        # of passing silently if either secret is ever missing or empty
        # again -- e.g. removed, renamed, or scoped to the wrong
        # environment -- so a SKIP can never again quietly read as a
        # security PASS for these two suites.
        if: ${{ vars.PORTAL_SECURITY_TESTS_REQUIRED == 'true' }}
        run: |
          missing=0
          if [ -z "$CUSTOMER_360_TEST_EMAIL" ]; then
            echo "::error::PORTAL_SECURITY_TESTS_REQUIRED is true but CUSTOMER_360_TEST_EMAIL secret is missing/empty -- portal-cross-persona-authorization.integration.test.ts and claim-customer-corroboration.integration.test.ts would silently SKIP instead of proving the security fix. Add the CUSTOMER_360_TEST_EMAIL repository secret, or set PORTAL_SECURITY_TESTS_REQUIRED back to false if these suites are not meant to run yet."
            missing=1
          fi
          if [ -z "$CUSTOMER_360_TEST_PASSWORD" ]; then
            echo "::error::PORTAL_SECURITY_TESTS_REQUIRED is true but CUSTOMER_360_TEST_PASSWORD secret is missing/empty -- same risk as above."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "Portal security QA credentials present -- portal-cross-persona-authorization and claim-customer-corroboration integration suites are expected to have executed for real above."
        env:
          CUSTOMER_360_TEST_EMAIL: ${{ secrets.CUSTOMER_360_TEST_EMAIL }}
          CUSTOMER_360_TEST_PASSWORD: ${{ secrets.CUSTOMER_360_TEST_PASSWORD }}

      - name: Migration filename sanity check (new files only)
        run: |
          # Controlled-scale readiness SP-002: this project has a known,
          # previously-audited, accepted body of historical filename/
          # version drift (documented in
          # docs/engineering/STAFF_360_FINAL_ACCEPTANCE_REPORT.md) --
          # some pre-2026-08-21 migration filenames don't match the
          # Supabase CLI's own <14-digit-timestamp>_<name>.sql convention,
          # and some historical timestamp prefixes collide. Re-litigating
          # or renaming that history is explicitly out of scope (rule:
          # "do not rewrite already-applied migration history"). This
          # check is therefore deliberately scoped to ONLY the migration
          # files this PR/push actually adds -- it enforces determinism
          # going forward without failing CI on inherited debt.
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_REF" ] || ! git cat-file -e "$BASE_REF" 2>/dev/null; then
            echo "No usable base ref (first push to a new branch, or shallow history) -- skipping new-file diff, nothing to compare against."
            exit 0
          fi
          new_files=$(git diff --name-only --diff-filter=A "$BASE_REF" HEAD -- supabase/migrations/ || true)
          if [ -z "$new_files" ]; then
            echo "No new migration files in this change."
            exit 0
          fi
          echo "New migration files:"
          echo "$new_files"
          bad=0
          for f in $new_files; do
            base=$(basename "$f")
            if ! echo "$base" | grep -qE '^[0-9]{14}_[a-zA-Z0-9_]+\.sql$'; then
              echo "::error file=$f::migration filename does not match <14-digit-timestamp>_<name>.sql"
              bad=1
            fi
          done
          # No new file's timestamp prefix may collide with ANY existing
          # migration (new-vs-new or new-vs-historical) -- ambiguous apply
          # order is never acceptable going forward, even against old debt.
          all_prefixes=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed -E 's/^([0-9]{14})_.*/\1/')
          for f in $new_files; do
            prefix=$(basename "$f" | sed -E 's/^([0-9]{14})_.*/\1/')
            count=$(echo "$all_prefixes" | grep -c "^${prefix}$" || true)
            if [ "$count" -gt 1 ]; then
              echo "::error file=$f::timestamp prefix $prefix collides with another migration"
              bad=1
            fi
          done
          if [ "$bad" -eq 1 ]; then exit 1; fi
          echo "New migration filenames OK"

  e2e-public:
    # Phase 4 (Staging + Automated E2E): runs only the ZERO-CREDENTIAL
    # Playwright suites (public pages, auth route guards, responsive
    # viewport checks — see E2E_TEST_STRATEGY.md). Deliberately does NOT
    # run e2e/staff/** or e2e/portal/** here -- those need a real minted
    # QA session (SUPABASE_SERVICE_ROLE_KEY as a CI secret, see
    # e2e/setup/mint-qa-sessions.ts), which is the same class of decision
    # this workflow's own "Unit tests" step already defers to the repo
    # owner for the Vitest integration suites' QA credentials -- not
    # silently skipped without disclosure, just not wired as a hard gate
    # without an explicit secret being added first.
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run zero-credential E2E suites
        run: npm run test:e2e -- --project=chromium-desktop e2e/public e2e/auth e2e/responsive
        env:
          # The real project URL + anon/publishable key -- NOT secrets by
          # Supabase's own design (see .env.example: "NEVER put the
          # service_role key here", implying the anon key is the one
          # that's meant to ship to a browser) and already present,
          # unencrypted, in this repo's shipped JS bundle on
          # mal3aby.app -- so hardcoding them here (rather than
          # requiring a repo secret that doesn't yet exist, confirmed
          # via `gh secret list`: only CLOUDFLARE_API_TOKEN is set) adds
          # no real exposure. These E2E suites genuinely need the real
          # backend (they assert on real /verify, /qr, /activate token
          # resolution behavior) -- the placeholder values the "Unit
          # tests" step above uses would make every one of these tests
          # fail against a nonexistent host.
          VITE_SUPABASE_URL: https://gxkrtlvpjwxhcqdisyob.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4a3J0bHZwand4aGNxZGlzeW9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTY5MDcsImV4cCI6MjEwMjMzMjkwN30.NAZm2_nrFXvAIWh_LVOInn_QTvJQ7vXp6oyjEdKxKV8

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

        # Authenticated suites (e2e/staff/**, e2e/portal/**) intentionally
        # NOT run here -- see E2E_TEST_STRATEGY.md "CI wiring". To
        # activate them: add SUPABASE_SERVICE_ROLE_KEY as a repository
        # secret, add an `npm run e2e:setup` step before `npm run
        # test:e2e` (with that secret in its env), and drop the
        # `e2e/public e2e/auth e2e/responsive` path filter above.
