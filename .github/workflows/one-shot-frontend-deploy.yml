name: One-shot Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-frontend-deploy.yml

permissions:
  contents: read

concurrency:
  group: mal3aby-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve public Supabase build configuration
        shell: bash
        env:
          SECRET_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          SUPABASE_URL="${SECRET_SUPABASE_URL:-https://gxkrtlvpjwxhcqdisyob.supabase.co}"
          SUPABASE_KEY="${SECRET_SUPABASE_ANON_KEY:-}"

          # The frontend anon/publishable key is intentionally public in every
          # browser bundle. If it is not mirrored as a GitHub secret, recover the
          # currently-live public value rather than committing it to the repo.
          if [ -z "$SUPABASE_KEY" ]; then
            HTML="$(curl -fsSL --retry 3 --retry-delay 2 https://mal3aby.app/)"
            mapfile -t ASSETS < <(printf '%s' "$HTML" | grep -oE '/assets/[^"'"'"']+\.js' | sort -u)
            for ASSET in "${ASSETS[@]}"; do
              JS="$(curl -fsSL --retry 3 --retry-delay 2 "https://mal3aby.app${ASSET}")"
              SUPABASE_KEY="$(printf '%s' "$JS" | grep -oE 'sb_publishable_[A-Za-z0-9._-]+' | head -n1 || true)"
              if [ -z "$SUPABASE_KEY" ]; then
                SUPABASE_KEY="$(printf '%s' "$JS" | grep -oE 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' | head -n1 || true)"
              fi
              [ -n "$SUPABASE_KEY" ] && break
            done
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Could not resolve the public Supabase anon/publishable key safely."
            exit 1
          fi

          SETTINGS_STATUS="$(curl -sS -o /tmp/supabase-settings.json -w '%{http_code}' -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/auth/v1/settings")"
          if [ "$SETTINGS_STATUS" != "200" ]; then
            echo "::error::Resolved Supabase public key failed validation (HTTP $SETTINGS_STATUS)."
            exit 1
          fi

          echo "::add-mask::$SUPABASE_KEY"
          echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_KEY" >> "$GITHUB_ENV"

      - name: Install app dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Install frontend Worker dependencies
        working-directory: cloudflare/frontend-worker
        run: npm ci

      - name: Deploy frontend Worker
        working-directory: cloudflare/frontend-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # This account id was previously discovered and recorded by the
          # project's authenticated production-deployment audit. It is an
          # account identifier, not a credential. Keep a secret/variable
          # override available in case the deployment account is migrated.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '35ac10727701095866b16c276b4a33d1' }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."
            exit 1
          fi
          npx wrangler deploy

      - name: Verify production frontend responds
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 -o /dev/null https://mal3aby.app/
          curl -fsS --retry 5 --retry-delay 2 -o /dev/null https://mal3aby.app/platform
          echo "Production domain and platform deep-link both respond successfully."
